{% extends "base.html" %}
{% block title %}Cubo · Subir{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Subir archivo</h1>

<form method="post" enctype="multipart/form-data" class="flex flex-col gap-4 bg-white p-6 rounded shadow">
  {% csrf_token %}
  
  <input type="file" name="file" accept=".csv,.xlsx,.xls"
         class="border border-gray-300 p-2 rounded" required>

  <label class="flex flex-col">
    <span class="mb-1 text-sm text-gray-600">Delimitador</span>
    <select name="delimiter" class="border border-gray-300 p-2 rounded">
      <option value=",">Coma (,)</option>
      <option value=";">Punto y coma (;)</option>
      <option value="\t">Tabulación</option>
      <option value="|">Barra vertical (|)</option>
    </select>
  </label>

  <label class="flex items-center gap-2">
    <input type="checkbox" name="has_header" checked class="rounded">
    <span class="text-sm text-gray-700">El archivo tiene encabezado</span>
  </label>

  <button class="bg-primary text-white py-2 rounded hover:bg-blue-700">
    Subir archivo
  </button>
</form>

{% endblock %}
