{% extends "base.html" %}
{% block title %}Cubo · Subir{% endblock %}
{% block content %}

<div class="max-w-5xl mx-auto">

  <h1 class="text-3xl font-bold text-primary mb-8">Subir Nuevo Dataset</h1>

  <form method="POST" enctype="multipart/form-data" class="space-y-8">
    {% csrf_token %}

    <!-- Selección del tipo de archivo -->
    <div>
      <h2 class="text-xl font-semibold mb-4">Selecciona el tipo de archivo</h2>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">

        <!-- CARD CSV -->
        <label class="cursor-pointer group">
          <input type="radio" name="file_type" value="csv" class="hidden peer" checked>

          <div class="glass p-6 rounded-xl border border-white/10 
            peer-checked:border-primary peer-checked:bg-primary/10
            hover:bg-white/5 transition-all shadow-lg backdrop-blur-xl">
            
            <div class="flex flex-col items-center gap-3">
              <!-- CSV Icon -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"
                  d="M12 4.5v15m4.5-15h-9m9 15h-9M4.5 9h15m-15 6h15" />
              </svg>

              <p class="text-lg font-semibold">CSV</p>
              <p class="text-xs opacity-70 text-center">Archivos separados por comas, delimitadores, cabecera opcional.</p>
            </div>
          </div>
        </label>

        <!-- CARD EXCEL -->
        <label class="cursor-pointer group">
          <input type="radio" name="file_type" value="excel" class="hidden peer">

          <div class="glass p-6 rounded-xl border border-white/10 
            peer-checked:border-primary peer-checked:bg-primary/10
            hover:bg-white/5 transition-all shadow-lg backdrop-blur-xl">
            
            <div class="flex flex-col items-center gap-3">
              <!-- Excel Icon -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"
                  d="M4 4h16v16H4z M9 8l6 8m0-8l-6 8" />
              </svg>

              <p class="text-lg font-semibold">Excel</p>
              <p class="text-xs opacity-70 text-center">Compatible con .xls y .xlsx.</p>
            </div>
          </div>
        </label>

        <!-- CARD JSON -->
        <label class="cursor-pointer group">
          <input type="radio" name="file_type" value="json" class="hidden peer">

          <div class="glass p-6 rounded-xl border border-white/10 
            peer-checked:border-primary peer-checked:bg-primary/10
            hover:bg-white/5 transition-all shadow-lg backdrop-blur-xl">
            
            <div class="flex flex-col items-center gap-3">
              <!-- JSON Icon -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"
                  d="M5 4v4m0 8v4m14-16v4m0 8v4M9 12h6" />
              </svg>

              <p class="text-lg font-semibold">JSON</p>
              <p class="text-xs opacity-70 text-center">Archivos estructurados en formato JSON.</p>
            </div>
          </div>
        </label>

      </div>
    </div>

    <!-- Upload file -->
    <div class="pt-4">
      <label class="block text-sm mb-1 font-semibold">Selecciona el archivo</label>
      <input id="fileInput" type="file" name="file" accept=".csv, .xlsx, .xls, .json" required
        class="w-full rounded-lg border border-white/20 bg-white/5 p-3 text-sm cursor-pointer file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-primary/20 file:text-primary file:text-sm hover:file:bg-primary/30">
    </div>

    <!-- Opciones solo para CSV -->
    <div id="csvOptions" class="space-y-4 transition-all">

      <h3 class="text-lg font-semibold">Opciones para CSV</h3>

      <div>
        <label class="block text-sm mb-1">Delimitador</label>
            <select name="delimiter" class="border border-gray-300 p-2 rounded">
              <option value=",">Coma (,)</option>
              <option value=";">Punto y coma (;)</option>
              <option value="\t">Tabulación</option>
              <option value="|">Barra vertical (|)</option>
            </select>
      </div>

      <label class="flex items-center gap-2">
        <input type="checkbox" name="has_header" class="w-4 h-4">
        <span class="text-sm">El archivo tiene encabezado</span>
      </label>
    </div>

    <!-- Submit -->
    <div class="pt-4">
      <button class="bg-primary text-white px-6 py-3 rounded-xl font-semibold shadow hover:bg-primary/80 transition">
        Subir dataset
      </button>
    </div>

  </form>

</div>

<script>
  // Mostrar opciones solo cuando el usuario elige CSV
  const radioInputs = document.querySelectorAll('input[name="file_type"]');
  const csvOptions = document.getElementById("csvOptions");

  function checkFileType() {
    const selected = document.querySelector('input[name="file_type"]:checked').value;
    csvOptions.style.display = selected === "csv" ? "block" : "none";
  }

  radioInputs.forEach(r => r.addEventListener("change", checkFileType));
  checkFileType();
</script>

<style>
  /* Estilo glass */
  .glass {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(14px);
  }
</style>

{% endblock %}
